<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thank You | Sensei Advisors</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="thank-you">
    <div class="shell">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">SA</span><span class="brand-name">Sensei Advisors</span></a>
      <div class="thank-you-card">
        <p class="eyebrow">Inquiry received</p>
        <h1>Thank you.</h1>
        <p>Your message has been submitted to Sensei Advisors. I’ll review the accounting or finance issue you described and follow up using the email address you provided.</p>
        <a class="button button-primary" href="/">Return to Sensei Advisors</a>
      </div>
    </div>
  </main>
  <style>
    .thank-you{min-height:100vh;background:var(--paper);padding:44px 0}.thank-you-card{background:white;max-width:800px;padding:clamp(40px,8vw,90px);margin:80px auto 0}.thank-you-card h1{margin-bottom:22px}.thank-you-card p:not(.eyebrow){font-size:20px;color:var(--slate);margin-bottom:30px}
  </style>
</body>
</html>
